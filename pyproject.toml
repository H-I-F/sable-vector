[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sable-vector"
version = "0.1.1"
description = "Embedded hybrid vector search engine for local AI agent runtimes, built on the sable LSM storage engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MKA930" }]
keywords = ["vector-database", "embedding", "ann", "lsm", "hybrid-search", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24", "typer>=0.12"]

[project.scripts]
sable-vector = "sable_vector.cli:app"

[project.optional-dependencies]
# The server is built on the low-level `Server.list_tools` / `Server.call_tool`
# decorator API, which mcp 2.x replaced with constructor callbacks. Pinning keeps
# the documented API; the migration is a separate, deliberate step.
mcp = ["mcp>=1.9,<2"]
sable = ["sable @ git+https://github.com/H-I-F/sable.git@v0.1.1"]
test = ["pytest>=7.4", "pytest-cov>=4.1"]
lint = ["ruff>=0.5", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/H-I-F/sable-vector"
Repository = "https://github.com/H-I-F/sable-vector"
"Storage engine" = "https://github.com/H-I-F/sable"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "benchmarks", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
disallow_untyped_decorators = true
[[tool.mypy.overrides]]
module = ["sable.*"]
ignore_missing_imports = true
